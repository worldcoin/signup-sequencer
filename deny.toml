[graph]
all-features = true

[sources]
unknown-registry = "deny"

[bans]
deny = [
    { crate = "metrics", deny-multiple-versions = true, reason = "metrics crate uses a global recorder - multiple versions may break metrics silently" },
]
# Unlike world-id-protocol's mobile bindings, this service uses native-tls via SQLx.
# OpenSSL is therefore not banned here.

[licenses]
version = 2
confidence-threshold = 1.0
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
version = "0.17.14"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# Match world-id-protocol's explicitly accepted unmaintained-crate notices.
# These are maintenance notices, not vulnerability exceptions. Do not add
# vulnerability IDs here; upgrade or patch the affected dependency instead.
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "Unmaintained derivative via Arkworks; same accepted maintenance notice as world-id-protocol." },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained paste via Alloy/telemetry; same accepted maintenance notice as world-id-protocol." },
]
